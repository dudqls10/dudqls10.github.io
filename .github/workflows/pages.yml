# Based on GitHub's official static Pages workflow.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production links
        run: |
          python3 scripts/check_local_links.py \
            index.html \
            projects/proximity-sensor-platform.html \
            projects/self-detection-compensation.html \
            projects/rmpflow-safety-control.html \
            projects/interactive-diffusion-policy.html \
            projects/undergraduate-projects.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
